# Build a macOS DMG and publish a GitHub Release.
#
# Trigger:
#   - Tag: git tag v0.0.1 && git push origin v0.0.1
#   - Or Actions -> Release -> Run workflow

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (empty = VERSION file or tag)"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  resolve-version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
            V="${V#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "v$V"

  macos-dmg:
    name: macOS DMG
    needs: resolve-version
    runs-on: macos-14
    env:
      # Job-level env so `if:` conditions below can check `env.*` — step
      # `if:` conditions can't reference `secrets.*` directly.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    outputs:
      signed: ${{ steps.sign-status.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Set VERSION
        run: echo "${{ needs.resolve-version.outputs.version }}" > VERSION

      # Only runs when MACOS_CERTIFICATE_P12 is configured (repo secrets ->
      # Settings -> Secrets and variables -> Actions). Without it, the build
      # falls back to ad-hoc signing, same as before — see the "Signing &
      # notarization" section in the README for how to set this up.
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          chmod +x scripts/*.sh mac-app/Scripts/*.sh
          ./scripts/build-dmg.sh

      - name: Notarize DMG
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' }}
        run: ./scripts/notarize-dmg.sh "$(cat dist/dmg-path.txt)"

      - name: Record signed status
        id: sign-status
        run: |
          if [[ -n "${CODESIGN_IDENTITY:-}" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/lit-*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve-version, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lah dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: lit v${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            dist/lit-*.dmg
          fail_on_unmatched_files: true
          body: |
            ## lit v${{ needs.resolve-version.outputs.version }}

            Free, open source (MIT) native macOS battery alerts & health
            monitoring. See [DATA_SOURCES.md](https://github.com/${{ github.repository }}/blob/main/mac-app/DATA_SOURCES.md)
            for exactly where every number comes from.

            ### Install
            1. Open the DMG -> drag **lit** to Applications
            2. ${{ needs.macos-dmg.outputs.signed == 'true' && 'Signed and notarized with a Developer ID certificate — Gatekeeper should open it with no warning' || 'Right-click -> **Open** if Gatekeeper warns (unsigned — no Apple Developer ID yet)' }}
            3. lit runs from the **menu bar** — no window opens; look for
               the battery icon. Click it for a quick glance, or the
               "Settings" row to open the full dashboard in your browser
            4. macOS will prompt to allow notifications on first launch —
               click Allow to get low-battery/lifecycle alerts

            ### Notes
            - Requires macOS 14 Sonoma or later
            - Universal binary (Apple Silicon & Intel)
            - ${{ needs.macos-dmg.outputs.signed == 'true' && 'Signed & notarized' || 'Build is **unsigned**' }} —
              everything runs locally, nothing phones home; read the
              source if you want to verify that yourself before trusting
              it with system access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
